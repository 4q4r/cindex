name: backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: unit tests
        run: go test ./...
      - name: integration tests (testcontainers)
        run: go test -count=1 -run TestMigrateAppliesFullSchema ./internal/platform/db/...
      - name: repository integration tests (testcontainers)
        run: go test -count=1 -run 'TestArticleLifecycle|TestSourceCircuitBreakerCounters|TestQuotesClaimAndPersist' ./internal/repository/...
