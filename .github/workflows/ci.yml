name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  unit:
    name: Lint And Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v3
      - name: Sync Dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: DATABASE_URL=sqlite:///test.sqlite3 uv run pytest -q -m "not live_smoke and not live_quality"

  live-smoke:
    name: Live Source Smoke
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v3
      - name: Sync Dependencies
        run: uv sync --group dev
      - name: Live Smoke
        env:
          RUN_LIVE_SMOKE: "1"
        run: DATABASE_URL=sqlite:///test.sqlite3 uv run pytest -q -m live_smoke --no-cov
      - name: Build Live Report
        run: DATABASE_URL=sqlite:///test.sqlite3 uv run python scripts/live_smoke_report.py --strict-errors --out tmp/live_smoke_report.json
      - name: Upload Live Report
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-report
          path: tmp/live_smoke_report.json
      - name: Fetch Previous Live Report
        run: uv run python scripts/fetch_previous_live_report.py --out tmp/previous_live_smoke_report.json
      - name: Check Live Degradation
        if: hashFiles('tmp/previous_live_smoke_report.json') != ''
        run: uv run python scripts/check_live_degradation.py --current tmp/live_smoke_report.json --previous tmp/previous_live_smoke_report.json

  live-quality:
    name: Live Quality Gate
    runs-on: ubuntu-latest
    needs: live-smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v3
      - name: Sync Dependencies
        run: uv sync --group dev
      - name: Live Quality Gate
        env:
          RUN_LIVE_QUALITY: "1"
        run: DATABASE_URL=sqlite:///test.sqlite3 uv run pytest -q -m live_quality --no-cov
