secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

services:
  migrate:
    build: ./backend
    env_file: .env
    entrypoint: ["/app/cindex-cli"]
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  app:
    build: ./backend
    env_file: .env
    environment:
      CINDEX_HTTP_ADDR: 0.0.0.0:8000
      CINDEX_ARTICLES_DIR: /app/var/articles
    volumes:
      - ./var/articles:/app/var/articles
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/cindex-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    environment:
      CINDEX_ARTICLES_DIR: /app/var/articles
      CINDEX_BROWSER_URL: http://browser:8081
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 7g
        reservations:
          memory: 6g
    volumes:
      - ./var/articles:/app/var/articles
    entrypoint: ["/app/cindex-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      browser:
        condition: service_healthy
    restart: unless-stopped

  browser:
    build: ./browser_service
    environment:
      CINDEX_BROWSER_PORT: "8081"
      CINDEX_PROFILE_DIR: /data/cloak-profile
      CINDEX_BROWSER_HEADLESS: "1"
      CINDEX_BROWSER_CONCURRENCY: "4"
    volumes:
      - cloak_profile:/data/cloak-profile
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2g
    restart: unless-stopped

  db:
    image: postgres:18.3
    environment:
      POSTGRES_DB: cindex
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d cindex"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:8.6.2-alpine3.23
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: oven/bun:1.3-alpine
    user: "${CINDEX_HOST_UID:-1000}:${CINDEX_HOST_GID:-1000}"
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run build"]
    restart: "no"

  nginx:
    image: nginx:latest
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    volumes:
      - ./nginx/entrypoint.sh:/docker-entrypoint.sh:ro
      - ./certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    environment:
      TLS_CERT_PATH: ${TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-}
    command: ["/bin/sh", "/docker-entrypoint.sh"]
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  pgdata:
  cloak_profile:
