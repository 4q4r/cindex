secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  secret_key:
    file: ./secrets/secret_key.txt

services:
  migrate:
    build: .
    env_file: .env
    secrets:
      - postgres_password
      - secret_key
    entrypoint: ["/app/.venv/bin/python"]
    command: ["manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file: .env
    secrets:
      - postgres_password
      - secret_key
    volumes:
      - ./local_imports:/app/local_imports
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  celery-worker:
    build: .
    env_file: .env
    secrets:
      - postgres_password
      - secret_key
    environment:
      CINDEX_RESUME_SEARCH_JOBS: "1"
      CINDEX_LOCAL_IMPORT_SCAN_INTERVAL_SECONDS: "30"
      CINDEX_LOCAL_IMPORT_DIRECTORY: /app/local_imports
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 7g
        reservations:
          memory: 6g
    volumes:
      - ./local_imports:/app/local_imports
    entrypoint: ["/app/.venv/bin/celery"]
    command: ["-A", "config", "worker", "-l", "info"]
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build: .
    env_file: .env
    secrets:
      - postgres_password
      - secret_key
    environment:
      CINDEX_NIGHTLY_INGESTION_INTERVAL_SECONDS: "0"
      CINDEX_LOCAL_IMPORT_SCAN_INTERVAL_SECONDS: "30"
      CINDEX_LOCAL_IMPORT_DIRECTORY: /app/local_imports
    volumes:
      - ./local_imports:/app/local_imports
    entrypoint: ["/app/.venv/bin/celery"]
    command: ["-A", "config", "beat", "-l", "info"]
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18.3
    environment:
      POSTGRES_DB: cindex
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d cindex"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:8.6.2-alpine3.23
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: oven/bun:1.3-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run build"]
    restart: "no"

  nginx:
    image: nginx:latest
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    volumes:
      - ./nginx/entrypoint.sh:/docker-entrypoint.sh:ro
      - ./certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    environment:
      TLS_CERT_PATH: ${TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-}
    command: ["/bin/sh", "/docker-entrypoint.sh"]
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  pgdata:
